<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Editai Motion · Naamã</title>
<script src="assets/gsap.min.js"></script>
<style>
@font-face{font-family:EditaiHelvetica;src:url('assets/fonts/Helvetica-Regular.otf');font-weight:400;font-display:block}
@font-face{font-family:EditaiScholar;src:url('assets/fonts/Scholar-Italic.otf');font-style:italic;font-display:block}
:root{--orange:__ORANGE__;--brown:__BROWN__;--ink:__INK__;--paper:__PAPER__;
  --glass:linear-gradient(140deg,rgba(255,255,255,.14),rgba(255,255,255,.03) 55%,rgba(255,109,41,.06));
  --glass-line:rgba(255,255,255,.18)}
*{box-sizing:border-box}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:var(--ink)}
#editai{position:relative;width:1080px;height:1920px;overflow:hidden;background:var(--ink);
  font-family:EditaiHelvetica,Helvetica,sans-serif;letter-spacing:-.05em;color:var(--paper)}

/* Fundo: gradiente quente + grade fina que some nas bordas */
#bg{position:absolute;inset:0;z-index:0;
  background:
    radial-gradient(70% 45% at 12% 30%,rgba(255,109,41,.55),transparent 70%),
    radial-gradient(60% 40% at 95% 85%,rgba(69,48,39,.9),transparent 70%),
    linear-gradient(180deg,#1d1513 0%,var(--ink) 60%)}
#grid{position:absolute;inset:0;z-index:1;
  background-image:linear-gradient(rgba(255,255,255,.07) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(255,255,255,.07) 1px,transparent 1px);
  background-size:72px 72px;background-position:-1px -1px;
  -webkit-mask-image:radial-gradient(85% 70% at 50% 45%,#000 40%,transparent 100%)}

/* Camera: muda de composicao com corte seco (full / split / motion) */
#camera{position:absolute;left:0;top:0;width:1080px;height:1920px;object-fit:cover;
  object-position:50% __FACE_Y__%;z-index:2;border-radius:0}
#frame{position:absolute;left:60px;top:880px;width:960px;height:900px;z-index:3;opacity:0;pointer-events:none}
#frame i{position:absolute;width:44px;height:44px;border:2px solid var(--paper);opacity:.85}
#frame i:nth-child(1){left:-2px;top:-2px;border-right:0;border-bottom:0;border-top-left-radius:36px}
#frame i:nth-child(2){right:-2px;top:-2px;border-left:0;border-bottom:0;border-top-right-radius:36px}
#frame i:nth-child(3){left:-2px;bottom:-2px;border-right:0;border-top:0;border-bottom-left-radius:36px}
#frame i:nth-child(4){right:-2px;bottom:-2px;border-left:0;border-top:0;border-bottom-right-radius:36px}

.clip{position:absolute}
/* Cenas: split usa a faixa de cima; motion usa a tela toda */
.scene{z-index:3}
.scene.split{left:60px;top:150px;width:960px;height:690px}
.scene.motion{left:0;top:0;width:1080px;height:1920px}
.scene.full{left:60px;top:150px;width:960px;height:620px}

/* Legenda: 2-3 palavras, peito, palavra-chave laranja */
.caption{left:60px;width:960px;z-index:5;text-align:center;color:#fff;
  font:400 __CAP_SIZE__px/1.1 EditaiHelvetica,Helvetica,sans-serif;letter-spacing:-.05em;
  text-shadow:0 2px 10px rgba(0,0,0,.45)}
.caption .key{display:inline-block;color:var(--orange);font-family:EditaiScholar,serif;font-style:italic;font-size:__IMPACT_SIZE__px;letter-spacing:0}

/* Kit de vidro */
.glass{position:absolute;border-radius:32px;background:var(--glass);border:1px solid var(--glass-line);
  -webkit-backdrop-filter:blur(26px) saturate(140%);backdrop-filter:blur(26px) saturate(140%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 24px 60px rgba(0,0,0,.35)}
.glass.pill{border-radius:999px}
.label{font-size:30px;color:rgba(245,242,235,.7);text-transform:uppercase;letter-spacing:.08em}
.big{font-size:120px;line-height:.95}
.serif{font-family:EditaiScholar,serif;font-style:italic;letter-spacing:0;word-spacing:.12em}
.orange{color:var(--orange)}
.bar{position:absolute;height:14px;border-radius:7px;background:rgba(255,255,255,.12);overflow:hidden}
.bar>b{position:absolute;inset:0;width:100%;transform-origin:0 50%;transform:scaleX(0);
  background:linear-gradient(90deg,var(--brown),var(--orange))}

/* Tipografia cinetica */
.kt{position:absolute;white-space:nowrap;font-size:150px;line-height:.9;color:var(--paper)}
.kt .ch{display:inline-block;will-change:transform}
</style></head><body>
<div id="editai" data-composition-id="editai" data-start="0" data-duration="__DURATION__" data-width="1080" data-height="1920">
<div id="bg"></div><div id="grid"></div>
<video id="camera" src="assets/clean.mp4" data-start="0" data-duration="__DURATION__" data-track-index="0" muted playsinline></video>
<audio id="voice" src="assets/clean.mp4" data-start="0" data-duration="__DURATION__" data-track-index="1" data-volume="1"></audio>
<div id="frame"><i></i><i></i><i></i><i></i></div>
__PANELS__
__CAPTIONS__
__SFX__
</div>
<script>
const timeline=gsap.timeline({paused:true});

/* Composicoes da camera: troca com corte seco (gsap.set), nunca animada */
const CAM={
  full:{left:0,top:0,width:1080,height:1920,borderRadius:0,opacity:1},
  split:{left:60,top:880,width:960,height:900,borderRadius:36,opacity:1},
  motion:{opacity:0}
};
for(const c of __CAMERA__){
  timeline.set('#camera',CAM[c.layout],c.t);
  timeline.set('#frame',{opacity:c.layout==='split'?1:0},c.t);
}

const BLUR=__BLUR__; /* 1 normal, 0.5 no modo leve */
/* Ajudantes de motion para as cenas */
const E={
  /* ENTRADA padrao: desacelera ao chegar (expo.out) com blur de movimento proporcional a distancia */
  enter(tl,target,t,o={}){const d=o.d||0.6,b=(o.blur??10)*BLUR;
    tl.fromTo(target,{opacity:0,x:o.x||0,y:o.y??28,scale:o.scale??0.96,filter:'blur('+b+'px)'},
      {opacity:1,x:0,y:0,scale:1,filter:'blur(0px)',duration:d,ease:o.ease||'expo.out',stagger:o.stagger||0,immediateRender:false},t);},
  /* SAIDA padrao: acelera ao sair (power2.in) e desfoca */
  exit(tl,target,t,o={}){const d=o.d||0.3,b=(o.blur??10)*BLUR;
    tl.to(target,{opacity:0,x:o.x||0,y:o.y??-22,scale:o.scale??1.02,filter:'blur('+b+'px)',duration:d,ease:'power2.in',stagger:o.stagger||0},t-d);},
  /* DERIVA continua: movimento lento e suave enquanto o elemento esta na tela */
  drift(tl,target,t,dur,o={}){tl.to(target,{y:o.y??-10,x:o.x||0,scale:o.scale??1.015,duration:dur,ease:'sine.inOut'},t);},
  /* A PALAVRA VIRA A CENA: cada palavra (ou bloco) ocupa a tela no tempo em que e dita
     e se transforma na proxima. words = [{t, text, key, size, x, y}] em coordenadas da tela */
  wordScene(tl,el,words,end){
    words.forEach((w,k)=>{
      const n=document.createElement('div');n.className='kt'+(w.key?' serif orange':'');
      n.textContent=w.text;n.style.left=(w.x??0)+'px';n.style.top=(w.y??820)+'px';
      n.style.fontSize=(w.size||(w.key?190:150))+'px';n.style.opacity=0;if(w.key)n.style.color='var(--orange)';if(w.x==null){n.style.width='1080px';n.style.textAlign='center';}
      el.appendChild(n);
      const out=(k+1<words.length?words[k+1].t:end);
      /* entra subindo com blur e leve overshoot de escala; palavra de impacto entra maior e mais lenta */
      tl.fromTo(n,{opacity:0,y:60,scale:w.key?0.82:0.9,filter:'blur('+14*BLUR+'px)'},
        {opacity:1,y:0,scale:1,filter:'blur(0px)',duration:w.key?0.55:0.42,ease:'expo.out',immediateRender:false},w.t);
      /* enquanto e dita: cresce devagar (nada parado) */
      tl.to(n,{scale:1.06,duration:Math.max(0.2,out-w.t-0.25),ease:'sine.out'},w.t+0.3);
      /* sai acelerando para cima, abrindo espaco para a proxima */
      tl.to(n,{opacity:0,y:-70,scale:1.12,filter:'blur('+12*BLUR+'px)',duration:0.24,ease:'power2.in'},out-0.2);
    });},
  /* quebra o texto em letras para animar uma a uma (stagger) */
  chars(el){const t=el.textContent;el.textContent='';return [...t].map(ch=>{const s=document.createElement('span');
    s.className='ch';s.textContent=ch===' '?' ':ch;el.appendChild(s);return s;});},
};

/* Enfase na legenda: subida curta (14 px), rapida e suave */
for(const k of __KEY_MOVES__){timeline.fromTo('#'+k.id+' .key',{y:14,opacity:0,filter:'blur('+4*BLUR+'px)'},{y:0,opacity:1,filter:'blur(0px)',duration:k.d,ease:'power3.out',immediateRender:false},k.t);}
__SCENE_SCRIPTS__

timeline.set('#editai',{opacity:1},__DURATION__);
window.__timelines=window.__timelines||{};
window.__timelines.editai=timeline;
</script></body></html>
