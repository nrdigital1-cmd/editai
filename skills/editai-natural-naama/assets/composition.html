<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Editai · Naamã</title>
<script src="assets/gsap.min.js"></script>
<style>
@font-face{font-family:EditaiHelvetica;src:url('assets/fonts/Helvetica-Regular.otf');font-weight:400;font-display:block}
@font-face{font-family:EditaiScholar;src:url('assets/fonts/Scholar-Italic.otf');font-style:italic;font-display:block}
:root{--black:#0a0a0a;--gray:#28282d;--purple:#8a2be2;--lime:#bfff00;--paper:#f5f2eb}
*{box-sizing:border-box}html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:var(--black)}
#editai{position:relative;width:1080px;height:1920px;overflow:hidden}
#camera{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.clip{position:absolute}
#captions{position:absolute;left:65px;top:__CAP_TOP__px;width:950px;height:100px;z-index:4}
.caption{inset:0;color:#fff;font:400 __CAP_SIZE__px/1.15 EditaiHelvetica,Helvetica,sans-serif;letter-spacing:-.05em;text-align:center;text-shadow:__SHADOW__;-webkit-text-stroke:0}
.impact{display:inline-block;font-family:EditaiScholar,serif;font-style:italic;font-size:__IMPACT_SIZE__px;letter-spacing:0}
.anuncios .impact{color:var(--lime)}
.overlay{border-radius:26px;overflow:hidden;z-index:3;box-shadow:0 3px 14px rgba(0,0,0,.18)}
.overlay img{display:block;width:100%;height:100%;object-fit:contain;border-radius:inherit}
.panel{width:100%;height:100%;padding:24px;border-radius:26px;background:var(--gray);color:var(--paper);font:400 40px/1.15 EditaiHelvetica,sans-serif;letter-spacing:-.05em}
.accent{color:var(--lime)}.violet{color:var(--purple)}
</style></head><body>
<div id="editai" class="__STYLE__" data-composition-id="editai" data-start="0" data-duration="__DURATION__" data-width="1080" data-height="1920">
<video id="camera" src="assets/clean.mp4" data-start="0" data-duration="__DURATION__" data-track-index="0" muted playsinline></video>
<audio id="voice" src="assets/clean.mp4" data-start="0" data-duration="__DURATION__" data-track-index="1" data-volume="1"></audio>
__OVERLAYS__
<div id="captions">__CAPTIONS__</div>
</div>
<script>
const timeline=gsap.timeline({paused:true});
const motions=__MOTIONS__;
const BLUR=__BLUR__; /* 1 normal, 0.5 no modo leve */
for(const m of motions){
  const b=(m.blur||0)*BLUR;
  /* entrada: chega rapido e desacelera (expo.out); o desfoque some junto com a velocidade */
  timeline.fromTo('#'+m.id,{y:m.y,scale:m.scale,opacity:0,filter:'blur('+b+'px)'},
    {y:0,scale:1,opacity:1,filter:'blur(0px)',duration:m.duration,ease:'expo.out',immediateRender:false},m.start);
  if(m.drift&&m.end){
    const hold=m.end-m.start-m.duration-0.3;
    /* deriva sutil: nada fica congelado na tela */
    if(hold>0.2)timeline.to('#'+m.id,{y:-8,duration:hold,ease:'sine.inOut'},m.start+m.duration);
    /* saida: acelera (power2.in) e desfoca ao sair */
    timeline.to('#'+m.id,{opacity:0,y:-22,filter:'blur('+b+'px)',duration:0.3,ease:'power2.in'},m.end-0.3);
  }
}
timeline.set('#editai',{opacity:1},__DURATION__);
window.__timelines=window.__timelines||{};
window.__timelines.editai=timeline;
</script></body></html>
